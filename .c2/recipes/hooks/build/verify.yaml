id: pulse-docker-verify
execution_needs:
  base: ubuntu*
  capabilities: [docker]
input_schema:
  api_version: {type: string, default_value: c2.build-hook/v1}
  request: {type: string, default_value: ''}
  target_directory: {type: string, default_value: '.'}
  candidate: {type: string, default_value: working-tree}
  base: {type: string, default_value: ''}
  documents: {type: artifact_map, default_value: {}}
  settings: {type: artifact, required: false}
  prompt: {type: string, default_value: ''}
  title: {type: string, default_value: ''}
inputs:
  api_version: ${{ inputs.api_version }}
  request: ${{ inputs.request }}
  target_directory: ${{ inputs.target_directory }}
  candidate: ${{ inputs.candidate }}
  base: ${{ inputs.base }}
  documents: ${{ inputs.documents }}
sequence:
- id: deterministic
  op: command_execution
  const: true
  inputs:
    timeout: 25m
    capture_diagnostics: always
    env:
      VERIFY_CANDIDATE: ${{ inputs.candidate }}
      GOWORK: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    run: ./scripts/verify.sh
- id: live-cli
  op: command_execution
  const: true
  inputs:
    timeout: 65m
    capture_diagnostics: always
    env:
      VERIFY_CANDIDATE: ${{ inputs.candidate }}
      GOWORK: 'off'
      GOTOOLCHAIN: local
    run: ./scripts/verify-live.sh cli
- id: live-remote
  op: command_execution
  const: true
  inputs:
    timeout: 65m
    capture_diagnostics: always
    env:
      VERIFY_CANDIDATE: ${{ inputs.candidate }}
      GOWORK: 'off'
      GOTOOLCHAIN: local
    run: ./scripts/verify-live.sh remote
- id: live-linux
  op: command_execution
  const: true
  inputs:
    timeout: 65m
    capture_diagnostics: always
    env:
      VERIFY_CANDIDATE: ${{ inputs.candidate }}
      GOWORK: 'off'
      GOTOOLCHAIN: local
    run: ./scripts/verify-live.sh linux
outputs:
  api_version: c2.build-hook/v1
  status: passed
  summary: Deterministic verification including fixture gate controls and binary fidelity within stdout and stderr, all three CLI recovery scenarios, all five standalone remote suites and all six required Linux Docker suites passed. Execution logs include candidate and environment identities and live test events.
  artifact_refs: ${{ jq([sequence.deterministic.outputs.?diagnostics.orValue({}), sequence['live-cli'].outputs.?diagnostics.orValue({}), sequence['live-remote'].outputs.?diagnostics.orValue({}), sequence['live-linux'].outputs.?diagnostics.orValue({})], 'add') }}
